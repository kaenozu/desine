name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  compile-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile all examples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes
          find . -name '*.java' -print0 | xargs -0 javac -encoding UTF-8 -d build/classes

      - name: Smoke AdapterTest
        shell: bash
        run: |
          set -euo pipefail
          cp AdapterTest/newfile.txt AdapterTest/newfile.txt.before
          java -cp build/classes AdapterTest.Main "$GITHUB_WORKSPACE/AdapterTest"
          test -s AdapterTest/newfile.txt
          mv AdapterTest/newfile.txt.before AdapterTest/newfile.txt

      - name: Smoke TemplateMethod
        run: java -cp build/classes TemplateMethod.Main

      - name: Ensure smoke tests left no diff
        run: git diff --exit-code
